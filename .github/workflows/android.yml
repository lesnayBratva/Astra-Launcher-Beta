name: Export sources

on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Collect sources
        run: |
          mkdir -p export
          git ls-files > export/_all_files.txt
          git ls-files -z -- '*.kt' '*.java' '*.kts' '*.gradle' '*.xml' '*.properties' '*.toml' '*.json' '*.md' '*.yml' \
            | while IFS= read -r -d '' f; do
                case "$f" in
                  LWJGL/*|Terracotta/*|*/res/values-*) continue ;;
                esac
                if [ "$(stat -c%s "$f")" -lt 400000 ]; then
                  mkdir -p "export/$(dirname "$f")"
                  cp "$f" "export/$f"
                fi
              done
          find export -type f | wc -l
          du -sh export

      - uses: actions/upload-artifact@v7
        with:
          name: sources
          path: export
